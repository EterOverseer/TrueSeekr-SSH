name: Build APK

# รันเมื่อมีการ push ทุก branch หรือกดรันเองจากหน้า Actions
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ต้องใช้สร้าง Release
    steps:
      - uses: actions/checkout@v4

      # Android SDK มีติดมากับ runner อยู่แล้ว ต้องลงแค่ Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # repo นี้ไม่มี gradlew จึงติดตั้ง Gradle ตามเวอร์ชันที่ gradle-wrapper.properties กำหนด
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # build.gradle.kts เซ็น debug ด้วย ${rootDir}/debug.keystore ซึ่งอยู่ใน .gitignore
      # จึงสร้างคีย์ debug ชั่วคราวขึ้นมาในรอบ build (ค่าตรงกับที่ build.gradle.kts กำหนด)
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ปล่อย APK ลงหน้า Releases
      #  - push เข้า main → อัปเดต pre-release "latest-build" ด้วย APK ล่าสุด
      #  - push tag v*    → สร้าง release ปกติชื่อตาม tag (เช่น v1.0.0)
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PocketSSH-debug.apk
          NOTES="Debug-signed build of commit ${GITHUB_SHA::7}. CI creates a new debug key on every run, so uninstall the previous version before installing this one."
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" PocketSSH-debug.apk \
              --title "PocketSSH $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest-build --cleanup-tag --yes || true
            gh release create latest-build PocketSSH-debug.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Latest build (main)" --notes "$NOTES"
          fi
